name: Gate 6 Polling Stability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gate6-polling-stability.yml"
      - "tools/gate6/polling-stability.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate6-polling-stability
  cancel-in-progress: true

jobs:
  polling-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run 100-client polling test for 10 minutes
        id: polling
        continue-on-error: true
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/gate6/polling-stability.mjs "https://esports-operations-assistant-stagin.vercel.app" gate6-poll-result.json

      - name: Publish evidence tag
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="gate6-poll-${GITHUB_RUN_ID}"
          git tag -a "$tag" -F gate6-poll-result.json
          git push origin "$tag"
